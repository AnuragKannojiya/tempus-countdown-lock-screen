<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050510" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tempus — Countdown Lock Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Animated Gradient Mesh Background ===== -->
  <div class="bg-mesh">
    <div class="mesh-gradient mesh-1"></div>
    <div class="mesh-gradient mesh-2"></div>
    <div class="mesh-gradient mesh-3"></div>
    <div class="mesh-gradient mesh-4"></div>
  </div>

  <!-- ===== Starfield ===== -->
  <canvas id="starfield"></canvas>

  <!-- ===== 3D Particle Field ===== -->
  <canvas id="particle-canvas"></canvas>

  <!-- ===== Lock Screen ===== -->
  <div id="lock-screen" class="lock-screen">
    <!-- Top Status Bar -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-time" id="status-time"></span>
      </div>
      <span class="status-date" id="status-date"></span>
    </header>

    <!-- 3D Tilt Container -->
    <main class="countdown-main" id="tilt-container">
      <!-- Floating Orbs (3D depth layers) -->
      <div class="floating-orb orb-1"></div>
      <div class="floating-orb orb-2"></div>
      <div class="floating-orb orb-3"></div>

      <!-- Event Label with Glow -->
      <div class="event-label-wrapper">
        <div class="event-label" id="event-label">Loading…</div>
        <div class="event-label-glow" id="event-label-glow">Loading…</div>
      </div>

      <!-- 3D Countdown Ring -->
      <div class="ring-scene">
        <div class="ring-3d">
          <div class="ring-orbit">
            <div class="orbit-dot dot-1"></div>
            <div class="orbit-dot dot-2"></div>
            <div class="orbit-dot dot-3"></div>
            <div class="orbit-dot dot-4"></div>
          </div>

          <svg class="countdown-ring" viewBox="0 0 300 300">
            <defs>
              <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:var(--accent-1)" />
                <stop offset="50%" style="stop-color:var(--accent-2)" />
                <stop offset="100%" style="stop-color:var(--accent-3)" />
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="glow-intense">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <circle class="ring-track" cx="150" cy="150" r="140" />
            <circle class="ring-progress" id="ring-progress" cx="150" cy="150" r="140" filter="url(#glow)" />
            <circle class="ring-progress-glow" id="ring-progress-glow" cx="150" cy="150" r="140" filter="url(#glow-intense)" />
          </svg>

          <!-- 3D Flip Digits -->
          <div class="countdown-digits" id="countdown-digits">
            <div class="digit-group">
              <div class="flip-card" id="flip-days">
                <div class="flip-card-inner">
                  <div class="flip-front"><span>00</span></div>
                  <div class="flip-back"><span>00</span></div>
                </div>
              </div>
              <span class="digit-label">DAYS</span>
            </div>
            <div class="digit-sep-wrapper">
              <span class="digit-sep">:</span>
            </div>
            <div class="digit-group">
              <div class="flip-card" id="flip-hours">
                <div class="flip-card-inner">
                  <div class="flip-front"><span>00</span></div>
                  <div class="flip-back"><span>00</span></div>
                </div>
              </div>
              <span class="digit-label">HRS</span>
            </div>
            <div class="digit-sep-wrapper">
              <span class="digit-sep">:</span>
            </div>
            <div class="digit-group">
              <div class="flip-card" id="flip-mins">
                <div class="flip-card-inner">
                  <div class="flip-front"><span>00</span></div>
                  <div class="flip-back"><span>00</span></div>
                </div>
              </div>
              <span class="digit-label">MIN</span>
            </div>
            <div class="digit-sep-wrapper">
              <span class="digit-sep">:</span>
            </div>
            <div class="digit-group">
              <div class="flip-card" id="flip-secs">
                <div class="flip-card-inner">
                  <div class="flip-front"><span>00</span></div>
                  <div class="flip-back"><span>00</span></div>
                </div>
              </div>
              <span class="digit-label">SEC</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Progress Bar with Glow -->
      <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
          <div class="progress-bar-glow" id="progress-glow"></div>
        </div>
        <span class="progress-text" id="progress-text">0% complete</span>
      </div>

      <!-- Insight Pill -->
      <div class="progress-insight" id="progress-insight">
        <span class="insight-icon">⏳</span>
        <span class="insight-text" id="insight-text"></span>
      </div>

      <!-- Quote with typewriter effect -->
      <div class="quote-container" id="quote-container">
        <p class="quote-text" id="quote-text"></p>
      </div>
    </main>

    <!-- Bottom Actions -->
    <footer class="lock-footer">
      <button class="footer-btn glow-btn" id="btn-fullscreen" title="Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="footer-btn glow-btn" id="btn-settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="footer-btn glow-btn" id="btn-theme" title="Change Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </button>
      <button class="footer-btn glow-btn" id="btn-wake" title="Keep Awake">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6m-5-2a7 7 0 1 1 4 0"/></svg>
      </button>
    </footer>
  </div>

  <!-- ===== Settings Panel ===== -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-backdrop"></div>
    <div class="settings-card">
      <div class="settings-header">
        <h2>⚙️ Configure</h2>
        <button class="close-btn" id="close-settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="settings-body">
        <div class="form-group">
          <label for="event-name">Event Name</label>
          <input type="text" id="event-name" placeholder="e.g. Product Launch" maxlength="60" />
        </div>

        <div class="form-group">
          <label for="event-date">Target Date & Time</label>
          <input type="datetime-local" id="event-date" />
        </div>

        <div class="form-group">
          <label>Visual Theme</label>
          <div class="theme-grid" id="theme-grid">
            <button class="theme-swatch active" data-theme="cyberpunk" title="Cyberpunk">
              <span style="background:linear-gradient(135deg,#00f0ff,#b400ff,#ff006e)"></span>
              <i>Cyberpunk</i>
            </button>
            <button class="theme-swatch" data-theme="aurora" title="Aurora">
              <span style="background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899)"></span>
              <i>Aurora</i>
            </button>
            <button class="theme-swatch" data-theme="ocean" title="Ocean">
              <span style="background:linear-gradient(135deg,#06b6d4,#3b82f6,#1e40af)"></span>
              <i>Ocean</i>
            </button>
            <button class="theme-swatch" data-theme="inferno" title="Inferno">
              <span style="background:linear-gradient(135deg,#ff4500,#ff0080,#7b00ff)"></span>
              <i>Inferno</i>
            </button>
            <button class="theme-swatch" data-theme="matrix" title="Matrix">
              <span style="background:linear-gradient(135deg,#00ff41,#008f11,#003b00)"></span>
              <i>Matrix</i>
            </button>
            <button class="theme-swatch" data-theme="golden" title="Golden">
              <span style="background:linear-gradient(135deg,#f59e0b,#d97706,#92400e)"></span>
              <i>Golden</i>
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label>Urgency Mode</label>
            <label class="toggle">
              <input type="checkbox" id="urgency-toggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group flex-1">
            <label>Quotes</label>
            <label class="toggle">
              <input type="checkbox" id="quotes-toggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <button class="save-btn" id="save-settings">
          <span>Save & Lock</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
        </button>
      </div>

      <!-- Presets -->
      <div class="presets-section">
        <h3>⚡ Quick Presets</h3>
        <div class="presets-grid">
          <button class="preset-btn" data-preset="new-year"><span>🎆</span> New Year</button>
          <button class="preset-btn" data-preset="focus-25"><span>🧠</span> Focus 25m</button>
          <button class="preset-btn" data-preset="focus-50"><span>🎯</span> Focus 50m</button>
          <button class="preset-btn" data-preset="break-5"><span>☕</span> Break 5m</button>
          <button class="preset-btn" data-preset="workout"><span>💪</span> Workout</button>
          <button class="preset-btn" data-preset="custom-1h"><span>⏰</span> 1 Hour</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Celebration ===== -->
  <canvas id="confetti-canvas" class="confetti-canvas hidden"></canvas>
  <div id="celebration" class="celebration hidden">
    <div class="celebration-content">
      <div class="celebration-emoji">🎉</div>
      <h1 class="celebration-title">Time's Up!</h1>
      <p class="celebration-sub" id="celebration-event"></p>
      <button class="celebration-btn" id="celebration-dismiss">Set New Countdown</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
